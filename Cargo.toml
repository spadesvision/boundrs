[package]
name = "boundrs"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
egui = "0.26"
eframe = { version = "0.26", default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
] }
egui_extras = { version = "0.26", features = ["all_loaders"] }
image = { version = "0.*", features = ["jpeg", "png"], default_features = false }
# Add the types you want support forpalette = "*"
alphanumeric-sort = "*"
glob = "*"
anyhow = "*"
serde = { version = "*", features = ["derive"] }
toml = "*"
clap = { version = "4.1.8", features = ["derive"] }
csv = "1.3.0"
log = "0.4.20"
itertools = "0.12.0"
linfa-clustering = "0.7.0"
linfa = "0.7.0"
ndarray = "0.15.6"
env_logger = "0.11.1"
bje_datasets = { git = "ssh://git@github.com/spadesvision/bjrs.git", branch = "main" }
bje_detections = { git = "ssh://git@github.com/spadesvision/bjrs.git", branch = "main" }
# bje_datasets = { version = "0.1.0", path = "../bjrs/bje_datasets" }

[profile.release]
debug = true
